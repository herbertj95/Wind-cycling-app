<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="18 18 72 72">
  <!-- The app icon in one piece: the W of Wind drawn as a route in the colours the app paints the wind
       with (blue behind you, grey across or light, red against you), with the rider as the dot.
       `npm run android:icons` makes from it the icons for launchers older than adaptive icons.
       The same drawing is in public/favicon.svg, in splash.svg and, as the two layers of the adaptive
       icon, in android/app/src/main/res/drawable/ic_launcher_*.xml: change them together. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11293b"/>
      <stop offset="1" stop-color="#071520"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="72" height="72" rx="16" fill="url(#night)"/>
  <path d="M43 72L54 48L65 72" fill="none" stroke="#8fa5b3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 38L43 72" fill="none" stroke="#3987e5" stroke-width="8" stroke-linecap="round"/>
  <path d="M65 72L75 38" fill="none" stroke="#e66767" stroke-width="8" stroke-linecap="round"/>
  <circle cx="75" cy="38" r="6.5" fill="#eef4f7"/>
</svg>
