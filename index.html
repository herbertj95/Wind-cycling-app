<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wind speed and direction for cycling around Lisbon, on the map and along your route." />
    <meta name="theme-color" content="#0a1a27" />
    <title>Wind Cycling — wind for riding around Lisbon</title>
    <script>
      // pick the saved map (night or day) before the first paint
      try {
        var saved = localStorage.getItem('wind-theme');
        if (saved === 'light' || (!saved && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
